<!doctype html>
<html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CommandKit 插座用電與更新</title>
<style>
:root{font:16px/1.65 "Avenir Next",system-ui,sans-serif;color:#182f45;background:#f7f9fb;color-scheme:light}*{box-sizing:border-box}body{max-width:820px;margin:0 auto;padding:36px 22px 28px}header{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:24px}.brand{font-size:12px;font-weight:700;letter-spacing:.13em;color:#647789}h1{font-size:32px;line-height:1.2;letter-spacing:-.03em;margin:10px 0 0}h2{font-size:19px;margin:0 0 12px}p{margin:10px 0}.version{font-size:13px;text-align:right;color:#647789}.version strong{color:#182f45}.monitor{border:1px solid #d8e1e8;border-radius:16px;background:#fff;overflow:hidden;box-shadow:0 6px 24px #182f4506}.monitor-top{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;padding:16px 22px;background:#eef3f7;border-bottom:1px solid #d8e1e8;font-size:14px}#meter-state{color:#647789;font-weight:600}#meter-state[data-state=live]{color:#216747}#meter-state[data-state=offline]{color:#245b85}#relay{color:#647789}dl{display:grid;grid-template-columns:1fr 1fr;margin:0}.meter{min-width:0;padding:26px 22px}.meter:nth-child(odd){border-right:1px solid #d8e1e8}.meter:nth-child(-n+2){border-bottom:1px solid #d8e1e8}dt{font-size:14px;color:#647789;margin-bottom:12px}dd{margin:0;display:flex;flex-wrap:wrap;align-items:baseline;gap:8px}.reading{font:500 clamp(26px,5vw,38px)/1.2 ui-monospace,"SFMono-Regular",Menlo,monospace;font-variant-numeric:tabular-nums;letter-spacing:-.06em;color:#245b85;overflow-wrap:anywhere;min-width:0}#energy{font-size:clamp(19px,4vw,31px)}.unit{font-size:14px;color:#647789}.meter-note{font-size:12px;color:#647789;line-height:1.5;margin:12px 0 0}.monitor-foot{padding:14px 22px;border-top:1px solid #d8e1e8;color:#647789;font-size:13px;display:flex;flex-wrap:wrap;gap:4px 16px;justify-content:space-between}.updates{margin-top:34px;border-top:1px solid #d8e1e8;padding-top:24px}.updates>p{font-size:14px;color:#647789}.update-actions{margin:16px 0}details{margin-top:20px;padding:16px 18px;border:1px solid #d8e1e8;border-radius:10px;background:#fff}summary{cursor:pointer;font-weight:600}details[open] summary{margin-bottom:16px}label{display:block;font-size:14px}input{display:block;max-width:100%;font:inherit;font-size:14px;margin:10px 0 16px}button{border:0;border-radius:7px;padding:11px 16px;background:#245b85;color:#fff;font:inherit;font-size:14px;font-weight:600;cursor:pointer;margin:0 6px 6px 0}button.secondary{background:#e5edf4;color:#245b85}button:disabled{opacity:.55;cursor:wait}:focus-visible{outline:3px solid #245b85;outline-offset:4px}small{color:#647789;font-size:13px}#message{padding:14px 16px;border-left:3px solid #245b85;background:#eef3f7;white-space:pre-wrap;font-size:14px}footer{font-size:12px;color:#647789;margin-top:24px}@media(max-width:420px){body{padding:24px 16px}.meter{padding:22px 16px}.monitor-top,.monitor-foot{padding:14px 16px}header{align-items:flex-start}.version{max-width:125px}h1{font-size:28px}}
</style>
<header><div><span class="brand">COMMANDKIT / CMNDKT-004</span><h1>插座用電</h1></div><div class="version">韌體版本<br><strong id="current">讀取中…</strong></div></header>
<main>
<section class="monitor" aria-label="即時電力量測">
<div class="monitor-top"><span id="meter-state" role="status" aria-live="polite">正在連線…</span><span id="relay">插座狀態讀取中</span></div>
<dl>
<div class="meter"><dt>電壓</dt><dd><strong id="voltage" class="reading">—</strong><span class="unit">V</span></dd><p class="meter-note">交流有效值</p></div>
<div class="meter"><dt>電流</dt><dd><strong id="current-amps" class="reading">—</strong><span class="unit">A</span></dd><p class="meter-note">交流有效值</p></div>
<div class="meter"><dt>即時功率</dt><dd><strong id="power" class="reading">—</strong><span class="unit">W</span></dd><p class="meter-note">目前消耗的功率</p></div>
<div class="meter"><dt>累積用電</dt><dd><strong id="energy" class="reading">—</strong><span class="unit">kWh</span></dd><p class="meter-note">功率估算 · 約 30 秒保存</p></div>
</dl>
<div class="monitor-foot"><span id="meter-updated">等待量測資料</span><span>每 2 秒自動更新</span></div>
</section>
<section class="updates" aria-labelledby="update-heading"><h2 id="update-heading">韌體更新</h2><p>讓插座保持更新，原有設定與配對會保留。</p><div class="update-actions"><button id="check" class="secondary">檢查新版本</button><button id="online" hidden>下載並更新</button></div>
<details><summary>使用已下載的更新包</summary><label for="package">選擇 .ota 檔案</label><input type="file" id="package" accept=".ota"><button id="manual">驗證並更新</button><p><small>更新會暫停控制並重新啟動插座，請保持供電。</small></p></details>
<p id="message" role="status" aria-live="polite">可檢查新版本，或使用已下載的更新包。</p></section>
</main>
<footer>讀值無效或連線中斷時顯示「—」。累積用電從啟用電量紀錄起計算，不含先前的使用量。</footer>
<script>const CK_CATALOG_URL = {{CATALOG_URL}};
{{SCRIPT}}
</script></html>
