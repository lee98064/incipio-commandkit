# Setup-network-only DHCP; all runtime files live in /var RAM.
start 192.168.1.100
end 192.168.1.150
interface br0
max_leases 16
auto_time 60
remaining yes
lease_file /var/ck-udhcpd.leases
pidfile /var/run/ck-udhcpd.pid
option subnet 255.255.255.0
option router 192.168.1.254
option dns 192.168.1.254
option lease 600
