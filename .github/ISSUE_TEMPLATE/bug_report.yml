name: 錯誤回報
description: 回報韌體、設定或管理頁問題。
title: '[Bug] '
body:
  - type: markdown
    attributes:
      value: 請先去識別化；不要貼出金鑰、憑證、配對碼或裝置 dumps。安全漏洞請至 Security 私下回報。
  - type: input
    id: firmware_version
    attributes:
      label: 韌體版本
      placeholder: 0.3.0-preview
    validations:
      required: true
  - type: dropdown
    id: protocol
    attributes:
      label: 使用協議
      options:
        - Matter
        - HomeKit
    validations:
      required: true
  - type: textarea
    id: what_happened
    attributes:
      label: 發生什麼事
      description: 說明預期與實際結果。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 重現步驟
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 去識別化日誌
      description: 不要貼出金鑰、憑證或完整 dumps；僅附必要片段。
      render: text
