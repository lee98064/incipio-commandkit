name: 功能提案
description: 提出使用情境與可驗收的改善。
title: '[Feature] '
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解決的問題
      description: 說明目前操作的限制與使用情境。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建議行為
      description: 說明預期結果與驗收方式；不要附裝置秘密或 dumps。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已考慮的替代方式
