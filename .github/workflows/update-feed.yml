name: Publish update feed
on:
  # Allows publishing an already verified release before this workflow is on
  # the default branch. This tag never starts the firmware rebuild workflow.
  push:
    tags: ['updates-v*']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag
        required: true
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: update-feed
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pip install -r tools/requirements.txt
      - name: Download and verify published firmware
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          case "$RELEASE_TAG" in updates-*) RELEASE_TAG="${RELEASE_TAG#updates-}" ;; esac
          gh release view "$RELEASE_TAG" --json isDraft,tagName > /tmp/ck-release.json
          python3 - <<'PY'
          import json
          release=json.load(open('/tmp/ck-release.json'))
          assert not release['isDraft'], 'Publish the reviewed release before deploying the update feed'
          PY
          mkdir -p site/updates
          gh release download "$RELEASE_TAG" --pattern '*.ota' --pattern 'matter.json' --dir site/updates
          python3 tools/ota.py verify site/updates/matter.ota --public third_party/ota-signing.pub
          if [ -f site/updates/exec-test.ota ]; then
            gh release download "$RELEASE_TAG" --pattern 'exec-test.json' --dir site/updates
            python3 tools/ota.py verify site/updates/exec-test.ota --public third_party/ota-signing.pub
          fi
          python3 tools/ota.py catalog site/updates/*.ota --base-url "https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/updates" --output site/updates/index.json
          python3 - <<'PY'
          import json,urllib.request,urllib.error
          url=json.load(open('version.json'))['catalog_url']
          try:
              with urllib.request.urlopen(url,timeout=30) as source:old=json.load(source)
          except urllib.error.HTTPError as error:
              if error.code!=404:raise
              old={'updates':[]}
          incoming=json.load(open('site/updates/index.json'))
          import sys
          sys.path.insert(0,'tools')
          from ota import validate_catalog_upgrade
          validate_catalog_upgrade(old,incoming)
          PY
          touch site/.nojekyll
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deployment
