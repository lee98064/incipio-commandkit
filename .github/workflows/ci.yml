name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pip install -r tools/requirements.txt
      - run: python3 tools/generate_update.py
      - run: python3 tests/test_updates.py
      - run: python3 tests/test_legacy_mtd.py
      - run: python3 tests/test_startup_recovery.py
      - run: python3 tests/test_boot_guard.py
      - run: node tests/test_update_crypto.js
      - run: node tests/test_password_crypto.js
      - run: node tests/test_monitor.js
      - run: python3 tests/test_update_feed.py
      - run: python3 tests/test_setup_control.py
      - run: python3 tests/test_public_management.py
      - run: c++ -std=c++11 -Wall -Wextra -Werror firmware/matter/tests/energy_counter_tests.cpp -o /tmp/ck-energy-tests && /tmp/ck-energy-tests
      - run: c++ -std=c++11 -Wall -Wextra -Werror firmware/matter/src/relay/RelayEngine.cpp firmware/matter/tests/relay_engine_tests.cpp -o /tmp/ck-relay-tests && /tmp/ck-relay-tests
      - run: python3 tests/test_pages_site.py
      - run: python3 tests/test_changelog.py
